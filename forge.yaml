project:
  name: "ForgeDock Pi"
  owner: "RapierCraftStudios"
  repo: "forgedock-pi"
  description: "Pi package: ForgeDock /work-on and /orchestrate on the Pi harness"

paths:
  root: "."
  worktree_base: ".forge/worktrees"

branches:
  default: "main"
  staging: "staging"
  feature_pattern: "milestone/{slug}"

engine:
  # Core work-on sessions (builder + reviewer) run on Pi; any model Pi can reach.
  lean_runtime: "pi"

orchestration:
  max_concurrent: 4

verification:
  commands:
    typescript:
      typecheck: "npm run typecheck"
      test: "npm test"
